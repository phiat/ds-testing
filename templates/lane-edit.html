{{define "lane-edit.html"}}
<form class="lane-header"
      hx-put="/lanes/{{.Lane.ID}}"
      hx-target="#board"
      hx-swap="outerHTML">
    <input type="text" name="title" value="{{.Lane.Title}}" required
           class="input"
           style="min-width:0;width:100%;font-size:0.85rem;font-weight:600;padding:0.3rem 0.5rem;"
           autofocus
           hx-on::blur="this.form.requestSubmit()">
</form>
{{end}}
