{{define "card.html"}}
<div class="card {{if .Card.Tag}}card-tagged{{end}} {{if .Card.DueDate}}card-has-due{{end}}"
     id="card-{{.Card.ID}}"
     {{if .Card.Tag}}style="--tag-color: {{tagColor .Card.Tag}}"{{end}}>
    {{if .Card.ImageURL}}
    <div class="card-image">
        <img src="{{.Card.ImageURL}}" alt="" loading="lazy"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=card-image-fallback>image failed to load</div>')">
    </div>
    {{end}}
    <div class="card-body">
        <span class="card-title"
              hx-get="/cards/{{.Card.ID}}/edit"
              hx-trigger="click"
              hx-target="closest .card-body"
              hx-swap="outerHTML">{{.Card.Title}}</span>
        {{if .Card.Description}}
        <span class="card-desc">{{.Card.Description}}</span>
        {{end}}
        <div class="card-meta">
            {{if .Card.Tag}}
            <span class="card-tag tag-{{.Card.Tag}}">{{tagLabel .Card.Tag}}</span>
            {{end}}
            {{if .Card.DueDate}}
            <span class="card-due {{dueStatus .Card.DueDate}}">{{.Card.DueDate}}</span>
            {{end}}
        </div>
    </div>
    <div class="card-actions">
        <button class="btn-icon btn-icon-detail"
                hx-get="/cards/{{.Card.ID}}/detail"
                hx-target="#card-{{.Card.ID}}"
                hx-swap="outerHTML"
                title="Edit details">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <select class="move-select"
                hx-put="/cards/{{.Card.ID}}/move"
                hx-target="#board"
                hx-swap="outerHTML"
                name="lane_id">
            {{range .AllLanes}}
            <option value="{{.ID}}" {{if eq .ID $.Card.LaneID}}selected{{end}}>{{.Title}}</option>
            {{end}}
        </select>
        <button class="btn-icon btn-icon-danger"
                hx-delete="/cards/{{.Card.ID}}"
                hx-target="#board"
                hx-swap="outerHTML"
                hx-confirm="Delete this card?"
                title="Delete card">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
</div>
{{end}}
