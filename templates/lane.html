{{define "lane.html"}}
<div class="lane" id="lane-{{.Lane.ID}}">
    <div class="lane-header">
        <div class="lane-title-group">
            <h2 class="lane-title">{{.Lane.Title}}</h2>
            <span class="lane-count">{{len .Cards}}</span>
        </div>
        <div class="lane-actions">
            <button class="btn-icon"
                    hx-get="/lanes/{{.Lane.ID}}/edit-form"
                    hx-target="#lane-{{.Lane.ID}} .lane-header"
                    hx-swap="outerHTML"
                    title="Rename lane">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-icon btn-icon-danger"
                    hx-delete="/lanes/{{.Lane.ID}}"
                    hx-target="#board"
                    hx-swap="outerHTML"
                    hx-confirm="Delete this lane and all its cards?"
                    title="Delete lane">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>
    <div class="cards" id="cards-{{.Lane.ID}}">
        {{if .Cards}}
            {{range .Cards}}
                {{template "card.html" dict "Card" . "AllLanes" $.AllLanes}}
            {{end}}
        {{else}}
            <div class="cards-empty">No cards yet</div>
        {{end}}
    </div>
    <form class="add-card-form"
          hx-post="/cards"
          hx-target="#board"
          hx-swap="outerHTML"
          hx-on::after-request="this.reset()">
        <input type="hidden" name="lane_id" value="{{.Lane.ID}}">
        <input type="text" name="title" placeholder="+ Add card..." required
               class="input input-card">
    </form>
</div>
{{end}}
